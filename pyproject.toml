[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnose-helpers"
version = "0.1.0"
description = "Modality-agnostic helpers shared across the Hypnose repos: data-location resolution, sub-XXX/ses-YY layout walking, selector parsing, figure styles and saving."
readme = "README.md"
# 3.9 because hypnose-eeg-preprocessing is pinned there via pomegranate/somnotate.
# Every dependency below supports it, so any repo in the family can install this.
requires-python = ">=3.9"

# Deliberately minimal. A helper that needs a heavy dependency almost certainly
# knows something about the data and belongs in a modality repo instead.
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# read_figure_metadata() uses pypdf when it is present, but falls back to a small
# stdlib parser: matplotlib writes the PDF info dictionary uncompressed, so the
# provenance is recoverable without it. Install this only to read PDFs written by
# other tools -- provenance that needs an extra install is provenance nobody reads.
pdf = ["pypdf"]
test = ["pytest"]

[project.scripts]
# Inside the package, not a repo-root scripts/ dir, so it is reachable from every
# environment this is installed into -- that is the point of the tool being shared.
hypnose-set-data-location = "hypnose_helpers.cli.set_data_location:main"

[tool.setuptools.packages.find]
where = ["src"]
